<!Doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Jyothirmai">
    <meta name="decription" content="This page makes html interactive though forms by taking input from the user">

    <title>html forms</title>

    <link rel="icon" href="back.png">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <h1>Html Forms</h1>
    <h2>Contact me</h2>
    <!-- action sends the form input to whereever you want to for example: your server-->

    <form action="https://httpbin.org/get" method="get">
        <fieldset>
            <legend>Personal Info</legend>
            <!--for attribute value should match the id of the input attribute-->
            <p>
                <label for="firstName">First Name:</label>
                <input type="text" name="firstName" id="firstName" placeholder="firstname" autocomplete="on" required autofocus>

            </p>
            <p>
                <label for="lastName>">Last Name:</label>
                <input type="text" name="lastName>" id="lastName" placeholder="lastname" autocomplete="on" required>
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="password" required>
            </p>
            <p>
                <label for="phone">Phone:</label>
                <input type="tel" name="phone" id="phone" placeholder="5555555555" pattern="[6-9][0-9]{9}" required>
            </p>
            <p>
                <label for="decade">Favourite Decade:</label>
                <input type="number" name="decade" id="decade" min="1950" max="2023" step="10" value="1980">
            </p>
            <p>
                <label for="coffee">Favourite Coffee</label>
                <select name="coffee" id="coffee" multiple size="5">
              <optgroup label="coffees">
              <option value="regular coffee">Regular Coffee</option>
              <option value="iced coffee">Iced Coffee</option>
            </optgroup>
            <optgroup label="Espresso Drinks">
              <option value="Americano">Americano</option>
              <option value="latte" selected>latte</option>
              <option value="cappuccino">cappuccino</option>
              <option value="cortada">cortada</option>
            </optgroup>
            <option value="other">other</option>
            </select>

            </p>

            <!--   <p>
            <label for="coffee">Favourite Coffee:</label>
            <input type="text" name="coffee" id="coffee" list="coffee-list">
             it narrow downs the list as you type
        <datalist id="coffee-list">
                <option value="coffee">
                <option value="latte">
                <option value="Americano">
                <option value="latte">
                <option value="cappuccino">
                <option value="cortada">
            </datalist>
        </p> -->
        </fieldset>
        <br>
        <fieldset>
            <legend>Favourite food</legend>
            <p>
                <input type="radio" name="food" id="tacos" value="tacos">
                <label for="tacos">Tacos</label>

                <input type="radio" name="food" id="Pizza" value="Pizza">
                <label for="Pizza">Pizza</label>

                <input type="radio" name="food" id="other" value="other">
                <label for="other">Other</label>

            </p>
        </fieldset>
        <br>
        <fieldset>
            <legend>Do you have any pet?</legend>
            <p>
                <input type="checkbox" name="pets" id="dog" value="dog">
                <label for="dog">Dog</label>
            </p>
            <p>
                <input type="checkbox" name="pets" id="cat" value="cat">
                <label for="cat">Cat</label>
            </p>
            <p>
                <input type="checkbox" name="pets" id="fish" value="fish">
                <label for="fish">Fish</label>
            </p>
            <p>
                <input type="checkbox" name="pets" id="otherpet" value="otherpet">
                <label for="otherpet">Other</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>send me a note</legend>
            <label for="message">Your Message:</label>
            <br>
            <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here"></textarea>
        </fieldset>
        <br>
        <button type="submit">Submit</button>
        <button type="post" formaction="https://httpbin.org/post" formmethod="post">post</button>
        <button type="reset">Reset</button>

    </form>
</body>

</html>
